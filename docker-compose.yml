version: "3.8"

services:
  # Single worker: scheduler loop + Discord bot + /health API
  scraper-orchestrator:
    build: ./worker
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/housing.db
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-your_discord_webhook_here}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}
      - EXECUTION_MODE=${EXECUTION_MODE:-manual}
      - DRY_RUN=${DRY_RUN:-false}
      - HERMES_BASE_URL=${HERMES_BASE_URL:-https://api.openai.com/v1}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=${HERMES_MODEL:-gpt-4o-mini}
      - OSRM_URL=${OSRM_URL:-https://router.project-osrm.org/route/v1}
      - NOMINATIM_URL=${NOMINATIM_URL:-https://nominatim.openstreetmap.org/search}
      - ROOMSPOT_EMAIL=${ROOMSPOT_EMAIL:-}
      - ROOMSPOT_PASSWORD=${ROOMSPOT_PASSWORD:-}
      - KAMERNET_EMAIL=${KAMERNET_EMAIL:-}
      - KAMERNET_PASSWORD=${KAMERNET_PASSWORD:-}
      - ZERO_RESULT_ALERT_THRESHOLD=${ZERO_RESULT_ALERT_THRESHOLD:-3}
    ipc: host
    command: ["node", "dist/orchestrator.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend-dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/housing.db
    depends_on:
      - scraper-orchestrator
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

version: '3.8'

services:
  scraper-worker:
    build: ./worker
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      # Tell the worker exactly where to put the DB inside its container
      - DATABASE_URL=file:/app/data/housing.db
      - DISCORD_WEBHOOK_URL=your_discord_webhook_here
    # Optional: Prevents Chromium out-of-memory crashes in Docker
    ipc: host

  frontend-dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      # Tell the frontend exactly where to read the DB
      - DATABASE_URL=file:/app/data/housing.db
    depends_on:
      - scraper-worker
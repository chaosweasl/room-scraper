version: '3.8'

services:
  # Single orchestrator that runs all scrapers sequentially
  scraper-orchestrator:
    build: ./worker
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/housing.db
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-your_discord_webhook_here}
    ipc: host
    command: ["npx", "ts-node", "orchestrator.ts"]

  # Original Roomspot scraper (still runs independently)
  scraper-roomspot:
    build: ./worker
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/housing.db
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-your_discord_webhook_here}
    ipc: host
    command: ["npx", "ts-node", "index.ts"]

  frontend-dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/housing.db
    depends_on:
      - scraper-orchestrator
      - scraper-roomspot